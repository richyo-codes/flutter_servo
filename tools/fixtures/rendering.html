<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servo Rendering Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #111c2b;
    color: #fff8ed;
    font: 18px/1.5 Georgia, serif;
  }
  main { max-width: 1000px; margin: auto; padding: 48px 32px; }
  header { border-bottom: 1px solid #607486; padding-bottom: 24px; }
  h1 { font-size: clamp(36px, 6vw, 72px); line-height: 1; margin: 12px 0; }
  .label { font: 14px monospace; letter-spacing: .15em; text-transform: uppercase; }
  .specimens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 32px; }
  figure { margin: 0; min-width: 0; }
  .sample { height: 200px; background: #24364a; overflow: hidden; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; padding: 20px; }
  .grid span { grid-area: 1 / 1 / 4 / 3; background: #f64b61; border-radius: 60px 4px 60px 4px; }
  .grid b { grid-area: 2 / 3 / 4 / 4; background: #fcf0dd; }
  .flex { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .flex span { width: 36px; height: 100px; background: #24d7ae; transform: rotate(20deg); }
  figure:nth-child(3) .sample { background: linear-gradient(145deg, #354e6b, #172230); }
  svg { display: block; width: 100%; height: 100%; }
  figcaption { margin-top: 12px; }
  @media (max-width: 640px) { .specimens { grid-template-columns: 1fr; } }
</style>
<main>
  <header>
    <div class="label">Servo / Rendering test</div>
    <h1>Layout in color.</h1>
    <p>Three specimens exercise grid placement, flex alignment, transforms, and vector painting.</p>
  </header>
  <section class="specimens" aria-label="Rendering specimens">
    <figure>
      <div class="sample grid" aria-hidden="true"><span></span><b></b></div>
      <figcaption>01 / CSS Grid</figcaption>
    </figure>
    <figure>
      <div class="sample flex" aria-hidden="true"><span></span><span></span><span></span></div>
      <figcaption>02 / Flexbox &amp; transforms</figcaption>
    </figure>
    <figure>
      <div class="sample">
        <svg viewBox="0 0 240 200" aria-hidden="true">
          <circle cx="120" cy="100" r="60" fill="#f6cc45"/>
          <path d="M20 132 Q120 24 220 132" fill="none" stroke="#fff8ed" stroke-width="6"/>
        </svg>
      </div>
      <figcaption>03 / SVG &amp; gradient</figcaption>
    </figure>
  </section>
</main>
</html>
