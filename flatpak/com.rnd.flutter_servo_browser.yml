app-id: com.rnd.flutter_servo_browser
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: flutter_servo_example
finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - '*.la'
modules:
  - name: flutter-servo-browser
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/lib /app/share/flutter_servo_browser /app/share/applications /app/share/metainfo
      - cp -r bundle/lib /app/lib/
      - cp -r bundle/data /app/share/flutter_servo_browser/
      - install -Dm755 bundle/flutter_servo_example /app/bin/flutter_servo_example
      - install -Dm644 com.rnd.flutter_servo_browser.desktop /app/share/applications/com.rnd.flutter_servo_browser.desktop
      - install -Dm644 com.rnd.flutter_servo_browser.metainfo.xml /app/share/metainfo/com.rnd.flutter_servo_browser.metainfo.xml
    sources:
      - type: dir
        path: ../packages/flutter_servo/example/build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: com.rnd.flutter_servo_browser.desktop
      - type: file
        path: com.rnd.flutter_servo_browser.metainfo.xml
