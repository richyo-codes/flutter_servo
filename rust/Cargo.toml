[package]
name = "rust_lib_flutter_servo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = []
servo-engine = [
    "dep:dpi",
    "dep:percent-encoding",
    "dep:servo",
    "dep:servo-allocator",
    "dep:url",
]

[dependencies]
flutter_rust_bridge = "=2.12.0"
dpi = { version = "0.1", optional = true }
percent-encoding = { version = "2.3", optional = true }
servo = { path = "/path/to/servo/components/servo", default-features = false, features = ["baked-in-resources", "js_jit"], optional = true }
servo-allocator = { path = "/path/to/servo/components/allocator", optional = true }
url = { version = "2.5", optional = true }

[patch.crates-io]
surfman = { path = "/path/to/surfman" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
