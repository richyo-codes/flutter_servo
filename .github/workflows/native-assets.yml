name: Servo Native Assets

on:
  push:
    tags: ['native-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-native-assets.yml
    with:
      artifact_version: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/native-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: flutter-servo-native-*
          path: release-assets
          merge-multiple: true
      - name: Publish native release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^native-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Expected a native-v semantic version tag" >&2
            exit 1
          fi
          if grep -q '^TODO:' packages/flutter_servo/LICENSE; then
            echo "Set the package license before publishing native binaries" >&2
            exit 1
          fi
          test "$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest=false release-assets/*
