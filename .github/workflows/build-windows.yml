name: Build Windows Browser

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit to build; defaults to the caller's ref
        type: string
        default: ''
      artifact_version:
        description: Version for the browser archive
        type: string
        default: ''
      reuse_native_assets:
        description: Consume the Windows native archive from this workflow run
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      # Servo's WPT checkout exceeds MAX_PATH under the runner's user profile.
      CARGO_HOME: 'C:\ch'
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: astral-sh/setup-uv@v7
        if: '!inputs.reuse_native_assets'
        with:
          enable-cache: false
      - uses: KyleMayes/install-llvm-action@v2
        if: '!inputs.reuse_native_assets'
        with:
          version: '20.1'
          directory: ${{ runner.temp }}/llvm
      - name: Configure libclang
        if: '!inputs.reuse_native_assets'
        shell: pwsh
        run: '"LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/cache@v5
        if: '!inputs.reuse_native_assets'
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            .dart_tool/windows-deps
          key: windows-servo-short-cargo-${{ runner.os }}-${{ hashFiles('packages/flutter_servo/rust/Cargo.lock', 'tools/setup_windows.ps1') }}
      - uses: actions/download-artifact@v7
        if: inputs.reuse_native_assets
        with:
          name: flutter-servo-native-windows-x64-${{ inputs.checkout_ref || github.sha }}
          path: .dart_tool/ci-native-download
      - name: Use CI-built Servo library
        if: inputs.reuse_native_assets
        shell: bash
        run: bash tools/configure_ci_native_assets.sh .dart_tool/ci-native-download
      - name: Build release browser and run native renderer probe
        shell: pwsh
        env:
          REUSE_NATIVE_ASSETS: ${{ inputs.reuse_native_assets }}
        run: ./tools/build_windows.ps1 -Configuration Release -Probe -Prebuilt:($env:REUSE_NATIVE_ASSETS -eq 'true')
      - name: Test Servo accessibility and host decisions
        timeout-minutes: 2
        shell: pwsh
        run: >-
          python tools/test_servo_accessibility.py
          packages/flutter_servo/example/build/windows/x64/runner/Release/rust_lib_flutter_servo.dll
          --navigation-policy --popup --file-picker
      - name: Archive browser bundle
        shell: pwsh
        env:
          ARTIFACT_VERSION: ${{ inputs.artifact_version }}
        run: |
          $version = $env:ARTIFACT_VERSION
          if (-not $version) { $version = (git describe --tags --always).Trim() }
          $name = "flutter-servo-browser-$version-windows-x64-release"
          "ARTIFACT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bundle = 'packages/flutter_servo/example/build/windows/x64/runner/Release'
          foreach ($demo in @('login', 'licenses', 'documentation', 'video')) {
            $asset = Get-Item "$bundle/data/flutter_assets/assets/demos/$demo.html"
            if ($asset.Length -eq 0) { throw "Bundled demo $demo is empty" }
          }
          @("Commit: $(git rev-parse HEAD)", "Flutter: $(flutter --version)") | Set-Content "$bundle/BUILD_INFO.txt"
          Compress-Archive -Path "$bundle/*" -DestinationPath "$name.zip"
      - name: Verify Flutter host navigation in a packaged Windows runner
        timeout-minutes: 20
        working-directory: packages/flutter_servo/example
        shell: pwsh
        run: |
          flutter build windows --release --no-pub -t tool/navigation_probe.dart
          if ($LASTEXITCODE -ne 0) { throw 'Navigation probe build failed.' }
          $bundle = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $env:FLUTTER_SERVO_PROBE_RESULT = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          $process = Start-Process -FilePath (Join-Path $bundle 'flutter_servo_example.exe') -WorkingDirectory $bundle -PassThru
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw 'Packaged Flutter navigation probe timed out.'
          }
          if ($process.ExitCode -ne 0 -or !(Test-Path $env:FLUTTER_SERVO_PROBE_RESULT)) {
            throw "Packaged navigation probe failed (exit $($process.ExitCode))."
          }
          if ((Get-Content -Raw $env:FLUTTER_SERVO_PROBE_RESULT) -ne 'navigation-verified') {
            throw 'Flutter did not verify navigation decisions.'
          }
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 14
