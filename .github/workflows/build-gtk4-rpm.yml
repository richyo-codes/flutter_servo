name: Build GTK4 Browser RPM

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit to build; defaults to the caller's ref
        type: string
        default: ''
      artifact_version:
        description: Release tag; otherwise computed from git describe
        type: string
        default: ''

permissions:
  contents: read

jobs:
  gtk4-rpm:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      FLUTTER_GTK4_REPOSITORY: https://github.com/richyo-codes/flutter.git
      FLUTTER_GTK4_SHA: de20cd2c06847dbc887df574c585484c447a257c
      FLUTTER_PREBUILT_ENGINE_VERSION: f2b4375245d63bdb7007d42b4032e0e8d079780c
      FLUTTER_STORAGE_BASE_URL: https://pub-79a02b1963fb4da6b5e4e4816e8b7146.r2.dev
      FLUTTER_LINUX_GTK: gtk4
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      BROWSER_LICENSE: ${{ vars.BROWSER_LICENSE || 'LicenseRef-Unspecified' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}

      - name: Compute artifact version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.artifact_version }}
        run: |
          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version="$(git describe --tags --always --dirty)"
          fi
          echo "ARTIFACT_VERSION=${version#v}" >> "$GITHUB_ENV"

      - name: Make room for the Servo release build
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libclang-dev llvm-dev lld cmake ninja-build \
            pkg-config libgtk-3-dev libgtk-4-dev libepoxy-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri \
            libdbus-1-dev libfreetype6-dev libharfbuzz-dev libfontconfig1-dev \
            libudev-dev libunwind-dev libx11-dev libxmu-dev xorg-dev \
            libxkbcommon-dev libxkbcommon-x11-dev liblzma-dev libssl-dev \
            libsecret-1-dev libmimalloc-dev curl git unzip xz-utils zip \
            gperf m4 nasm rpm patchelf xvfb

      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.11 for Servo bindings
        run: uv python install 3.11

      - name: Install the package's Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' packages/flutter_servo/rust/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.pub-cache
          key: gtk4-rpm-${{ runner.os }}-${{ env.FLUTTER_GTK4_SHA }}-${{ hashFiles('packages/flutter_servo/rust/Cargo.lock', 'packages/flutter_servo/example/pubspec.lock') }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install pinned FVM and Flutter SDK
        shell: bash
        run: |
          dart pub global activate fvm 4.2.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm fork add richyo-codes "$FLUTTER_GTK4_REPOSITORY"
          fvm install "richyo-codes/$FLUTTER_GTK4_SHA" --setup --skip-pub-get
          fvm use "richyo-codes/$FLUTTER_GTK4_SHA" --force --skip-setup --skip-pub-get
          test "$(git -C .fvm/flutter_sdk rev-parse HEAD)" = "$FLUTTER_GTK4_SHA"
          test "$(cat .fvm/flutter_sdk/bin/cache/engine.stamp)" = "$FLUTTER_PREBUILT_ENGINE_VERSION"

      - name: Install and validate prebuilt GTK4 engines
        shell: bash
        run: |
          bash tools/install_gtk4_prebuilt_engine.sh .fvm/flutter_sdk
          .fvm/flutter_sdk/bin/flutter config --enable-linux-desktop
          .fvm/flutter_sdk/bin/flutter precache --linux

      - name: Build the browser and Rust renderer in release mode
        shell: bash
        run: |
          sdk="$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin/flutter"
          cd packages/flutter_servo/example
          sed -i 's/^      rust_build_mode: debug$/      rust_build_mode: release/' pubspec.yaml
          grep -q '^      rust_build_mode: release$' pubspec.yaml
          "$sdk" pub get
          "$sdk" build linux --release --linux-gtk=gtk4

      - name: Verify the native renderer and GTK4 linkage
        shell: bash
        run: |
          bundle=packages/flutter_servo/example/build/linux-gtk4/x64/release/bundle
          bash tools/verify_gtk4_bundle.sh "$bundle"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            bash tools/run_native_session_probe.sh \
            "$GITHUB_WORKSPACE/$bundle/lib/librust_lib_flutter_servo.so" --input-controls
          cp .fvm/flutter_sdk/bin/cache/artifacts/engine/linux-x64-release/LICENSE.flutter_gtk.md "$bundle/"
          if [[ "$BROWSER_LICENSE" != LicenseRef-Unspecified ]]; then
            test -f LICENSE
            if grep -q TODO LICENSE; then exit 1; fi
            cp LICENSE "$bundle/"
          fi
          printf 'Version: %s\nApp commit: %s\nFlutter commit: %s\nEngine: %s\nRust mode: release\nGTK: 4\nLicense: %s\n' \
            "$ARTIFACT_VERSION" "$(git rev-parse HEAD)" "$FLUTTER_GTK4_SHA" \
            "$FLUTTER_PREBUILT_ENGINE_VERSION" "$BROWSER_LICENSE" > "$bundle/BUILD_INFO.txt"

      - name: Build RPM and checksums
        shell: bash
        run: bash tools/build_browser_rpm.sh --version "$ARTIFACT_VERSION" --out-dir build/packages/rpm/gtk4

      - name: Archive the release bundle with executable permissions
        shell: bash
        run: |
          mkdir -p build/packages/bundle
          tar -C packages/flutter_servo/example/build/linux-gtk4/x64/release/bundle \
            -czf "build/packages/bundle/flutter-servo-browser-linux-x86_64-gtk4-$ARTIFACT_VERSION.tar.gz" .

      - name: Upload GTK4 RPM
        uses: actions/upload-artifact@v4
        with:
          name: flutter-servo-browser-linux-x86_64-gtk4-rpm-${{ env.ARTIFACT_VERSION }}
          path: build/packages/rpm/gtk4/
          if-no-files-found: error
          retention-days: 14

      - name: Upload GTK4 release bundle
        uses: actions/upload-artifact@v4
        with:
          name: flutter-servo-browser-linux-x86_64-gtk4-bundle-${{ env.ARTIFACT_VERSION }}
          path: build/packages/bundle/*.tar.gz
          if-no-files-found: error
          retention-days: 14
