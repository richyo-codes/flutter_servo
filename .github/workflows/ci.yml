name: Browser CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/checks.yml

  gtk4-rpm:
    needs: tests
    uses: ./.github/workflows/build-gtk4-rpm.yml
