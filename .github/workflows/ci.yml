name: Browser CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    uses: ./.github/workflows/build-native-assets.yml
    with:
      platform: linux-x64

  native-windows:
    uses: ./.github/workflows/build-native-assets.yml
    with:
      platform: windows-x64

  tests:
    needs: native-linux
    uses: ./.github/workflows/checks.yml

  gtk4-rpm:
    needs: tests
    uses: ./.github/workflows/build-gtk4-rpm.yml

  windows:
    needs: [tests, native-windows]
    uses: ./.github/workflows/build-windows.yml
    with:
      reuse_native_assets: true
