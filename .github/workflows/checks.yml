name: Browser Checks

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit to test; defaults to the caller's ref
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve package and example dependencies
        shell: bash
        run: |
          cd packages/flutter_servo
          flutter pub get
          cd example
          flutter pub get
      - name: Analyze Flutter package and example
        working-directory: packages/flutter_servo
        run: flutter analyze --no-pub
      - name: Install native runtime and Linux package test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-3-dev libgtk-4-dev libfontconfig1 \
            libfreetype6 libegl1 libgl1-mesa-dri rpm dpkg-dev patchelf shellcheck cpio
      - uses: actions/download-artifact@v4
        with:
          name: flutter-servo-native-linux-x64-${{ inputs.checkout_ref || github.sha }}
          path: .dart_tool/ci-native-download
      - name: Use CI-built Servo library
        run: bash tools/configure_ci_native_assets.sh .dart_tool/ci-native-download
      - name: Test browser and input plumbing
        working-directory: packages/flutter_servo/example
        run: flutter test ../test test
      - name: Test Rust helpers
        run: cargo test --locked --manifest-path packages/flutter_servo/rust/Cargo.toml --lib
      - name: Test Linux packaging
        run: python3 tools/test_browser_rpm.py
      - name: Check packaging scripts
        run: shellcheck -x tools/build_browser_{rpm,deb}.sh tools/linux_browser_packaging.sh tools/install_gtk4_prebuilt_engine.sh tools/verify_{linux,gtk4}_bundle.sh
      - name: Report disk usage
        if: always()
        run: df -h .
