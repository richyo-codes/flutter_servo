name: Browser Checks

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit to test; defaults to the caller's ref
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - name: Free disk space for the Servo build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve package and example dependencies
        shell: bash
        run: |
          cd packages/flutter_servo
          flutter pub get
          cd example
          flutter pub get
      - name: Analyze Flutter package and example
        working-directory: packages/flutter_servo
        run: flutter analyze --no-pub
      - name: Install Servo build and RPM test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev llvm-dev lld cmake ninja-build \
            pkg-config libgtk-3-dev libgtk-4-dev libepoxy-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev libfreetype6-dev libharfbuzz-dev libfontconfig1-dev libudev-dev \
            libunwind-dev libx11-dev libxmu-dev xorg-dev libxkbcommon-dev libxkbcommon-x11-dev \
            liblzma-dev libssl-dev libsecret-1-dev libmimalloc-dev gperf m4 nasm xvfb curl ca-certificates \
            rpm patchelf shellcheck cpio
          pkg-config --modversion 'freetype2 >= 24.3.18'
      - uses: astral-sh/setup-uv@v6
      - name: Install Python for Servo bindings
        run: uv python install 3.11
      - name: Test browser and input plumbing
        working-directory: packages/flutter_servo/example
        run: flutter test ../test test
      - name: Test Rust helpers
        run: cargo test --locked --manifest-path packages/flutter_servo/rust/Cargo.toml --lib
      - name: Test RPM packaging
        run: python3 tools/test_browser_rpm.py
      - name: Check packaging scripts
        run: shellcheck tools/build_browser_rpm.sh tools/install_gtk4_prebuilt_engine.sh tools/verify_gtk4_bundle.sh
      - name: Report disk usage
        if: always()
        run: df -h .
