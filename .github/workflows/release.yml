name: Browser Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browser-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve the release tag to a fixed commit
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Expected an existing v-prefixed semantic version tag" >&2
            exit 1
          fi
          commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  native-linux:
    needs: validate
    uses: ./.github/workflows/build-native-assets.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.commit }}
      platform: linux-x64

  native-windows:
    needs: validate
    uses: ./.github/workflows/build-native-assets.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.commit }}
      platform: windows-x64

  native-linux-arm64:
    needs: validate
    uses: ./.github/workflows/build-native-assets.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.commit }}
      platform: linux-arm64

  tests:
    needs: [validate, native-linux]
    uses: ./.github/workflows/checks.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.commit }}

  linux:
    needs: [validate, tests, native-linux-arm64]
    uses: ./.github/workflows/build-linux-browser.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.commit }}
      artifact_version: ${{ needs.validate.outputs.tag }}

  windows:
    needs: [validate, tests, native-windows]
    uses: ./.github/workflows/build-windows.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.commit }}
      artifact_version: ${{ needs.validate.outputs.tag }}
      reuse_native_assets: true

  publish:
    needs: [validate, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: flutter-servo-browser-*
          path: release-assets
          merge-multiple: true
      - name: Publish tagged Linux and Windows browser releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          shopt -s nullglob
          assets=()
          for target in x86_64:gtk3 x86_64:gtk4 aarch64:gtk3; do
            machine="${target%:*}"
            gtk="${target#*:}"
            for extension in rpm deb tar.gz; do
              files=(release-assets/flutter-servo-browser-linux-"$machine"-"$gtk"-*."$extension")
              if (( ${#files[@]} != 1 )); then
                echo "Expected one $gtk $extension artifact" >&2
                exit 1
              fi
              assets+=("${files[0]}")
            done
          done
          windows=(release-assets/flutter-servo-browser-*-windows-x64-release.zip)
          if (( ${#windows[@]} != 1 )); then
            echo "Expected one Windows bundle" >&2
            exit 1
          fi
          assets+=("${windows[@]}" release-assets/*.sha256 release-assets/*.requires.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "${assets[@]}"
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${options[@]}" "${assets[@]}"
          fi
