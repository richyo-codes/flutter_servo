[package]
name = "rust_lib_flutter_servo"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_lib_flutter_servo"
crate-type = ["cdylib", "staticlib"]

[features]
default = []
servo-engine = [
    "dep:dpi",
    "dep:percent-encoding",
    "dep:servo",
    "dep:servo-allocator",
    "dep:url",
    "dep:surfman",
    "dep:gleam",
    "dep:glow",
    "dep:euclid",
]

[dependencies]
flutter_rust_bridge = "=2.13.0"
keyboard-types = "0.8.3"
serde_json = "1"
surfman = { version = "0.14.0", optional = true }
gleam = { version = "0.15", optional = true }
glow = { version = "0.17", optional = true }
euclid = { version = "0.22", optional = true }
dpi = { version = "0.1", optional = true }
percent-encoding = { version = "2.3", optional = true }
servo = { git = "https://github.com/richyo-codes/servo", rev = "18ead822e67b7660f7ee46cd03e6780940d7cc34", default-features = false, features = ["baked-in-resources", "js_jit", "clipboard"], optional = true }
servo-allocator = { git = "https://github.com/richyo-codes/servo", rev = "18ead822e67b7660f7ee46cd03e6780940d7cc34", optional = true }
url = { version = "2.5", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# ANGLE provides modern GLES on Windows, including D3D11 WARP on CI machines.
servo = { git = "https://github.com/richyo-codes/servo", rev = "18ead822e67b7660f7ee46cd03e6780940d7cc34", default-features = false, features = ["no-wgl"], optional = true }

[patch.crates-io]
surfman = { git = "https://github.com/richyo-codes/surfman", rev = "0e2cd47b6390eefb6d0ecbb927a34bc03fc0f2cb" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
