name: flutter_servo
description: "Flutter package for embedding Servo-backed web content."
version: 0.1.2
repository: https://github.com/richyo-codes/flutter_servo
issue_tracker: https://github.com/richyo-codes/flutter_servo/issues
topics:
  - webview
  - browser
  - servo
  - desktop

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  code_assets: ^2.2.0
  archive: ^4.7.1
  crypto: ^3.0.8
  material_ui: ^1.5.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.15.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      linux:
        pluginClass: FlutterServoPlugin
      windows:
        pluginClass: FlutterServoPluginCApi
