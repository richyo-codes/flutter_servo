name: flutter_servo
description: "Flutter package for embedding Servo-backed web content."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  rust_lib_flutter_servo:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      linux:
        pluginClass: FlutterServoPlugin
